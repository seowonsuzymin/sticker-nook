<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sticker Nook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── Profile picker (shown before the game) ─────────────────── -->
<div class="profile-screen" id="profileScreen" hidden>
  <div class="ps-inner">
    <div class="ps-brand">
      <span class="hud-logo">✿</span>
      <h1>Sticker Nook</h1>
    </div>
    <p class="ps-sub">Choose a nook to decorate</p>
    <div class="ps-slots" id="psSlots"></div>
    <p class="ps-foot">Each nook keeps its own coins, stickers, rooms and layouts.</p>
  </div>
</div>

<!-- ── Room select: fixed top bar over a scrolling hex grid ───── -->
<div class="room-select" id="roomSelect" hidden>
  <header class="rs-bar">
    <button class="btn btn-icon" id="rsHome" title="Switch nook" aria-label="Switch nook">⌂</button>
    <button class="coin-pill rs-coin" id="rsCoinPill" title="Play a mini-game to earn coins">
      <span class="coin-icon"></span>
      <span class="coin-amount" id="rsCoins">0</span>
      <span class="rs-coin-plus">+</span>
    </button>
    <button class="btn btn-icon" id="rsSettings" title="Settings" aria-label="Settings">⚙</button>
  </header>
  <div class="rs-scroll">
    <div class="hex-grid" id="hexGrid"></div>
  </div>
</div>

<div id="app" hidden>

  <!-- ── Header / HUD ─────────────────────────────────────────── -->
  <header class="hud">
    <div class="hud-brand">
      <button class="btn btn-icon" id="btnBackToRooms" title="Back to your rooms" aria-label="Back to your rooms">←</button>
      <h1 id="roomTitle">Room</h1>
    </div>

    <div class="hud-right">
      <div class="coin-pill" id="coinPill" title="Your coins">
        <span class="coin-icon"></span>
        <span class="coin-amount" id="coinAmount">0</span>
      </div>
      <button class="btn btn-play" id="btnPlay">
        <span class="btn-play-icon">▶</span> Earn Coins
      </button>
      <button class="btn btn-icon" id="btnSettings" title="Settings">⚙</button>
    </div>
  </header>

  <!-- ── Stage ────────────────────────────────────────────────── -->
  <main class="stage-wrap">
    <div class="stage" id="stage">
      <div class="room-layer" id="roomLayer"></div>
      <div class="sticker-layer" id="stickerLayer"></div>
      <div class="stage-hint" id="stageHint">Drag a sticker from the tray below ✨</div>
    </div>
  </main>

  <!-- ── Sticker tray ─────────────────────────────────────────── -->
  <section class="tray">
    <div class="tray-head">
      <div class="tray-cats" id="trayCats"></div>
      <div class="tray-count" id="trayCount"></div>
    </div>
    <div class="tray-scroll" id="trayScroll"></div>
  </section>

</div>

<!-- ── Arcade overlay (shared by every mini-game) ─────────────── -->
<div class="overlay arcade-overlay" id="arcadeOverlay" hidden>
  <div class="arcade-frame">
    <div class="arcade-hud">
      <div class="arc-stat">
        <span class="arc-stat-label">Time</span>
        <span class="arc-stat-value" id="arcTime">40</span>
      </div>
      <div class="arc-stat arc-stat-coins">
        <span class="arc-stat-label">Earned</span>
        <span class="arc-stat-value" id="arcCoins">0</span>
      </div>
      <div class="arc-stat">
        <span class="arc-stat-label" id="arcMeterLabel">Combo</span>
        <span class="arc-stat-value" id="arcMeter">x1</span>
      </div>
      <button class="btn btn-icon arcade-quit" id="arcQuit" title="Quit">✕</button>
    </div>
    <div class="arcade-timebar"><div class="arcade-timebar-fill" id="arcTimebar"></div></div>
    <div class="arcade-field" id="arcField"></div>

    <!-- countdown, announcing which game came up -->
    <div class="arcade-countdown" id="arcCountdown" hidden>
      <div class="ac-name" id="arcName"></div>
      <div class="ac-tag" id="arcTag"></div>
      <div class="ac-num" id="arcNum">3</div>
    </div>

    <!-- results -->
    <div class="arcade-results" id="arcResults" hidden>
      <div class="results-card">
        <div class="results-burst">✧</div>
        <h2 id="arcResultTitle">Nice work!</h2>
        <div class="results-coins">
          <span class="coin-icon"></span>
          <span id="arcResultCoins">0</span>
        </div>
        <div class="results-rows" id="arcResultRows"></div>
        <div class="results-actions">
          <button class="btn btn-ghost" id="btnCollect">Collect</button>
          <button class="btn btn-play" id="btnAgain">Play again</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── Generic modal ──────────────────────────────────────────── -->
<div class="overlay modal-overlay" id="modalOverlay" hidden>
  <div class="modal" id="modal">
    <div class="modal-art" id="modalArt"></div>
    <h2 id="modalTitle">Title</h2>
    <p id="modalBody">Body</p>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<!-- ── Settings sheet ─────────────────────────────────────────── -->
<div class="overlay modal-overlay" id="settingsOverlay" hidden>
  <div class="modal settings-modal">
    <h2>Settings</h2>
    <div class="settings-who" id="settingsWho"></div>
    <div class="settings-stats" id="settingsStats"></div>
    <div class="settings-list">
      <button class="settings-row" id="btnSwitchProfile">
        <span class="settings-row-icon">👤</span>
        <span><b>Switch nook</b><small>Back to the profile picker — this nook is saved</small></span>
      </button>
      <button class="settings-row" id="btnClearRoom">
        <span class="settings-row-icon">🧹</span>
        <span><b>Clear this room</b><small>Remove every sticker from the current room</small></span>
      </button>
      <button class="settings-row settings-row-danger" id="btnReset">
        <span class="settings-row-icon">↺</span>
        <span><b>Reset progress</b><small>Wipe coins, stickers, rooms &amp; layouts</small></span>
      </button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCloseSettings">Close</button>
    </div>
  </div>
</div>

<!-- ── New profile dialog ─────────────────────────────────────── -->
<div class="overlay modal-overlay" id="newProfileOverlay" hidden>
  <div class="modal">
    <h2>New nook</h2>
    <p>Pick your character, then name your nook.</p>
    <div class="np-chars" id="npChars"></div>
    <input class="np-name" id="npName" type="text" maxlength="14"
           placeholder="My Nook" autocomplete="off" spellcheck="false">
    <div class="np-colors" id="npColors"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="npCancel">Cancel</button>
      <button class="btn btn-play" id="npCreate">Create</button>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="js/data/stickers.js"></script>
<script src="js/data/rooms.js"></script>
<script src="js/data/characters.js"></script>
<script src="js/profiles.js"></script>
<script src="js/state.js"></script>
<script src="js/art.js"></script>
<script src="js/room.js"></script>
<script src="js/tray.js"></script>
<script src="js/games/arcade.js"></script>
<script src="js/games/catch.js"></script>
<script src="js/games/memory.js"></script>
<script src="js/games/peekaboo.js"></script>
<script src="js/room-select.js"></script>
<script src="js/ui.js"></script>
<script src="js/profile-screen.js"></script>
<script src="js/main.js"></script>
</body>
</html>
